<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OminiLab Debug Console</title>
<meta name="description" content="Open OminiLab base scenes, auto-built scenes and lab runs live in Isaac Sim, with a one-line status for each.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <span class="logo" aria-hidden="true">◎</span>
      <div>
        <div class="brand-name">OminiLab Debug Console</div>
        <div class="brand-sub" id="updated">Loading…</div>
      </div>
    </div>
    <div class="top-right">
      <span id="session"></span>
      <label class="port">Tunnel port <input id="portInput" inputmode="numeric" aria-label="Local tunnel port"></label>
      <button class="theme-btn" id="themeBtn" type="button">◐</button>
    </div>
  </div>
  <nav class="wrap tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
</header>
<main class="wrap" id="main"></main>
<footer class="wrap foot">
  Live view connects only to <code>127.0.0.1</code> through your own SSH tunnel; nothing on this page exposes a control port.
  Scene content includes ChemLab assets (CC BY-NC 4.0).
</footer>
<script src="data/status.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
