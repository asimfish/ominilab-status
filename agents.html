<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OminiLab Project Map</title>
<meta name="description" content="How OminiLab's three steps and their agents fit together, from real papers to evaluated policies, with each part's progress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="agents.html" style="text-decoration:none;color:inherit">
      <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="9" fill="var(--text)"/><circle cx="17" cy="17" r="8.5" fill="none" stroke="var(--bg)" stroke-width="2.4"/><circle cx="17" cy="17" r="3" fill="var(--s1)"/><circle cx="23.5" cy="11" r="2.2" fill="var(--s3)"/></svg>
      <div><div class="brand-name">OminiLab Project Map</div><div class="brand-sub" id="updated">Loading…</div></div>
    </a>
    <div class="top-right"><button class="icon-btn" id="themeBtn" type="button">◐ Auto</button></div>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="Pages"></nav>
</header>

<main class="wrap" style="gap:16px">
  <section class="map-hero">
    <h1>From real papers to evaluated policies</h1>
    <p id="goal"></p>
  </section>
  <div class="flow" id="flow" aria-label="End-to-end pipeline"></div>
  <div class="mentors" id="mentors"></div>
  <div class="map-scroll"><div class="map" id="map"></div></div>
  <div class="legend" aria-hidden="true">
    <span><svg viewBox="0 0 32 8"><line x1="0" y1="4" x2="32" y2="4" stroke="var(--text-2)"/></svg>hands work on</span>
    <span><svg viewBox="0 0 32 8"><line x1="0" y1="4" x2="32" y2="4" stroke="var(--muted)" stroke-dasharray="5 4"/></svg>feeds or supports</span>
    <span><svg viewBox="0 0 32 8"><line x1="0" y1="4" x2="32" y2="4" stroke="var(--bad)" stroke-dasharray="6 4"/></svg>stuck: waiting with nobody to act</span>
    <span>Click any card for its detailed progress.</span>
  </div>
  <section class="decisions" id="decisions"></section>
</main>
<footer class="wrap foot">Maintained from <code>data/status.json</code> (<code>pipeline</code> section); the same data drives the step pages.</footer>
<script src="data/status.js"></script>
<script src="assets/common.js"></script>
<script src="assets/map.js"></script>
</body>
</html>
